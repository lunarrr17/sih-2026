version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ip_sakti_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage:z
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ip_sakti_backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - CONFIDENCE_THRESHOLD=0.60
    depends_on:
      - qdrant
    volumes:
      - ./backend/data:/app/backend/data
    restart: unless-stopped
