version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ip_sakti_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage:z
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ip_sakti_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - CONFIDENCE_THRESHOLD=0.60
    depends_on:
      - qdrant
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./docs:/app/docs
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: ip_sakti_frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
